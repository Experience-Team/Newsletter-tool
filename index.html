<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #FADADD;
      color: #000000;
      line-height: 1.5;
    }

    /* ── Top bar ── */
    .topbar {
      background: #000000;
      color: #fff;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar h1 { font-size: 16px; font-weight: 700; letter-spacing: .5px; }
    .topbar-right { display: flex; align-items: center; gap: 16px; }
    .topbar .hint { font-size: 12px; color: #C8C8C8; }

    .btn-guidelines {
      background: none;
      border: 1px solid #C8C8C8;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      cursor: pointer;
      transition: all .15s;
      font-family: inherit;
      position: relative;
    }
    .btn-guidelines:hover { background: #333333; border-color: #fff; }
    .btn-guidelines:hover .btn-tooltip { visibility: visible; opacity: 1; }
    .btn-guidelines .btn-tooltip {
      bottom: auto;
      top: calc(100% + 10px);
    }
    .btn-guidelines .btn-tooltip::after {
      top: auto;
      bottom: 100%;
      border-top-color: transparent;
      border-bottom-color: #000000;
    }
    .draft-banner {
      background: #1a1a1a;
      color: #C8C8C8;
      font-size: 12px;
      padding: 8px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid #333;
    }
    .draft-banner-dismiss {
      background: none;
      border: 1px solid #555;
      border-radius: 4px;
      color: #C8C8C8;
      font-size: 11px;
      padding: 3px 10px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .draft-banner-dismiss:hover { border-color: #aaa; color: #fff; }
    .emoji-suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }
    .emoji-suggestions button {
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      transition: background .1s;
    }
    .emoji-suggestions button:hover { background: #e0e0e0; }
    .char-counter {
      font-size: 11px;
      color: #888;
      text-align: right;
      margin-top: 2px;
    }
    .char-counter.over { color: #E8383A; font-weight: 700; }

    /* ── Layout ── */
    .editor-layout {
      display: flex;
      gap: 0;
      min-height: calc(100vh - 48px);
    }

    /* ── Form panel ── */
    .form-panel {
      width: 420px;
      min-width: 360px;
      background: #fff;
      border-right: 1px solid #C8C8C8;
      padding: 28px 24px 80px;
      overflow-y: auto;
      max-height: calc(100vh - 48px);
    }

    .form-section {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid #C8C8C8;
    }
    .form-section:last-child { border-bottom: none; }

    .form-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #E8383A;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #000000;
      margin-bottom: 5px;
    }

    input[type="text"], textarea {
      display: block;
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #C8C8C8;
      border-radius: 4px;
      background: #FFFFFF;
      color: #000000;
      transition: border-color .15s;
      margin-bottom: 14px;
    }
    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #E8383A;
      background: #fff;
    }
    textarea { resize: vertical; min-height: 80px; }

    select {
      display: block;
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #C8C8C8;
      border-radius: 4px;
      background: #FFFFFF;
      color: #000000;
      margin-bottom: 10px;
      cursor: pointer;
    }
    select:focus { outline: none; border-color: #E8383A; }

    .inline-fields {
      display: flex;
      gap: 10px;
    }
    .inline-fields .field { flex: 1; }
    .inline-fields .field-narrow { flex: 0 0 35%; }

    /* ── Content blocks ── */
    .content-block {
      background: #FADADD;
      border: 1px solid #C8C8C8;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
    }
    .content-block .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .content-block .block-number {
      font-size: 12px;
      font-weight: 700;
      color: #000000;
    }

    .btn-remove {
      background: none;
      border: 1px solid #C8C8C8;
      border-radius: 4px;
      color: #C8C8C8;
      font-size: 12px;
      padding: 3px 10px;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-remove:hover { color: #E8383A; border-color: #E8383A; }

    .btn-add {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px dashed #E8383A;
      border-radius: 6px;
      color: #E8383A;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      transition: all .15s;
      width: 100%;
      justify-content: center;
    }
    .btn-add:hover { background: #FADADD; }

    .add-section-wrap { position: relative; }
    .add-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0; right: 0;
      background: #fff;
      border: 1px solid #C8C8C8;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      z-index: 10;
      overflow: hidden;
    }
    .add-menu.open { display: block; }
    .add-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 11px 16px;
      font-size: 13px;
      font-family: inherit;
      color: #000000;
      cursor: pointer;
      transition: background .1s;
    }
    .add-menu button:hover { background: #FADADD; }
    .add-menu button span {
      display: block;
      font-size: 11px;
      color: #C8C8C8;
      font-weight: 400;
      margin-top: 2px;
    }
    .add-menu button + button { border-top: 1px solid #C8C8C8; }

    .block-type-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #E8383A;
      background: #FADADD;
      border-radius: 3px;
      padding: 2px 8px;
      margin-left: 8px;
    }

    /* ── Preview panel ── */
    .preview-panel {
      flex: 1;
      overflow-y: auto;
      max-height: calc(100vh - 48px);
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #C8C8C8;
      margin-bottom: 16px;
    }

    .preview-frame {
      width: 640px;
      background: #FADADD;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #C8C8C8;
      padding: 12px 32px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }

    .btn-copy {
      background: #000000;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 11px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      position: relative;
    }
    .btn-copy:hover { background: #333333; }

    .btn-tooltip {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: calc(100% + 10px);
      right: 0;
      width: 280px;
      background: #000000;
      color: #fff;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.5;
      padding: 10px 14px;
      border-radius: 6px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      transition: opacity .2s, visibility .2s;
      pointer-events: none;
    }
    .btn-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 24px;
      border: 6px solid transparent;
      border-top-color: #000000;
    }
    .btn-copy:hover .btn-tooltip {
      visibility: visible;
      opacity: 1;
    }

    .copy-feedback {
      font-size: 13px;
      color: #2e9e6b;
      font-weight: 600;
      opacity: 0;
      transition: opacity .2s;
    }
    .copy-feedback.show { opacity: 1; }

    .img-warning, .img-info {
      font-size: 12px;
      line-height: 1.4;
      margin: -10px 0 14px 0;
      padding: 0;
    }
    .img-warning { color: #E8383A; }
    .img-info { color: #E8383A; }
  </style>
</head>
<body>


<!-- Top bar -->
<div class="topbar">
  <h1>Newsletter Editor</h1>
  <div class="topbar-right">
    <span class="hint">Fill in the form on the left &mdash; the preview updates live</span>
    <button class="btn-guidelines" onclick="saveDraftFile()">Save draft<span class="btn-tooltip">Downloads your current newsletter as a .json file. To save, just click the button &mdash; a file named gazette-draft-[date].json will download automatically. Use this to back up your work or share a draft with someone else.</span></button>
    <button class="btn-guidelines" onclick="document.getElementById('loadDraftInput').click()">Load draft<span class="btn-tooltip">Restores a previously saved draft from a .json file. Click the button, select your gazette-draft file, and your content will reload automatically. This replaces your current content.</span></button>
    <input type="file" id="loadDraftInput" accept=".json" style="display:none" onchange="loadDraftFile(this)">
    <a href="/newsletter-guide" class="btn-guidelines" style="text-decoration:none;" target="_blank" rel="noopener noreferrer">How to create a newsletter</a>
  </div>
</div>

<div id="draftBanner" class="draft-banner" style="display:none;">
  <span id="draftBannerText"></span>
  <button class="draft-banner-dismiss" onclick="document.getElementById('draftBanner').style.display='none'">Dismiss</button>
</div>

<div class="editor-layout">

  <!-- ════════════════════════════════════ -->
  <!-- FORM PANEL                          -->
  <!-- ════════════════════════════════════ -->
  <div class="form-panel">

    <!-- Header -->
    <div class="form-section">
      <div class="form-section-title">Header</div>
      <div class="inline-fields">
        <div class="field">
          <label for="editionDate">Date</label>
          <input type="text" id="editionDate" placeholder="e.g. March 2026" oninput="renderPreview()" />
        </div>
        <div class="field-narrow">
          <label for="editionNumber">Edition</label>
          <input type="text" id="editionNumber" placeholder="e.g. 12" oninput="renderPreview()" />
        </div>
      </div>
      <label for="logoUrl">Logo Image URL <span style="font-weight:400;color:#C8C8C8;">(optional)</span></label>
      <input type="text" id="logoUrl" placeholder="e.g. https://yoursite.com/logo.png"
             oninput="processImageUrl(this, 'logoUrlMsg', function() { renderPreview(); })"
             onpaste="setTimeout(function(){ processImageUrl(document.getElementById('logoUrl'), 'logoUrlMsg', function() { renderPreview(); }); }, 0)" />
      <div id="logoUrlMsg"></div>
      <label for="heroImageUrl">Hero Image URL <span style="font-weight:400;color:#C8C8C8;">(optional)</span></label>
      <input type="text" id="heroImageUrl" value="https://res.cloudinary.com/dxejokjeh/image/upload/v1775803064/Exploration_through_innovation_and_adventure_rm1asn.png" placeholder="e.g. https://yoursite.com/hero.jpg"
             oninput="processImageUrl(this, 'heroImageUrlMsg', function() { renderPreview(); })"
             onpaste="setTimeout(function(){ processImageUrl(document.getElementById('heroImageUrl'), 'heroImageUrlMsg', function() { renderPreview(); }); }, 0)" />
      <div id="heroImageUrlMsg"></div>
    </div>

    <!-- Introduction -->
    <div class="form-section">
      <div class="form-section-title">Introduction</div>
      <label for="heroHeadline">Headline</label>
      <input type="text" id="heroHeadline" placeholder="e.g. Welcome to April's CX Gazette" oninput="renderPreview()" />
      <div style="margin-top:10px; padding:10px 12px; background:#F5F5F5; border-radius:4px;">
        <label style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#888;">By-line <span style="font-weight:400;color:#C8C8C8;">(optional)</span></label>
        <select id="heroBylineSelect" onchange="pickHeroByline(this.value); this.value='';">
          <option value="">— Pick from team —</option>
        </select>
        <div class="inline-fields">
          <div class="field">
            <input type="text" id="heroBylineName" placeholder="Name — Leave blank for no by-line. For guest editors, enter their details manually."
                   oninput="renderPreview()" />
          </div>
          <div class="field">
            <input type="text" id="heroBylineRole" placeholder="Role (e.g. Senior Designer)"
                   oninput="renderPreview()" />
          </div>
        </div>
      </div>
      <label for="heroBody">Body</label>
      <textarea id="heroBody" rows="4" placeholder="Keep to around 900 characters / 130 words." oninput="renderPreview()">Set a positive tone for the Gazette. Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse commodo dapibus lectus, sed lacinia nisi pellentesque sed. Aliquam erat volutpat. In tincidunt massa id rutrum hendrerit. Phasellus semper purus id ante blandit, ut hendrerit lorem lobortis. Maecenas risus justo, blandit et metus et, aliquam porttitor augue.</textarea>
    </div>

    <!-- Trivia Question -->
    <div class="form-section">
      <div class="form-section-title">Trivia Question</div>
      <label for="triviaQuestion">Question</label>
      <textarea id="triviaQuestion" rows="2" placeholder="e.g. What year was our company founded?" oninput="renderPreview()"></textarea>
      <label for="triviaEmoji" style="margin-top:10px;">Emoji <span style="font-weight:400;color:#C8C8C8;">(optional)</span></label>
      <div class="emoji-suggestions">
        <button type="button" onclick="setTriviaEmoji('🤔')">🤔</button>
        <button type="button" onclick="setTriviaEmoji('💡')">💡</button>
        <button type="button" onclick="setTriviaEmoji('🎯')">🎯</button>
        <button type="button" onclick="setTriviaEmoji('🧠')">🧠</button>
        <button type="button" onclick="setTriviaEmoji('❓')">❓</button>
        <button type="button" onclick="setTriviaEmoji('🏆')">🏆</button>
        <button type="button" onclick="setTriviaEmoji('🎲')">🎲</button>
        <button type="button" onclick="setTriviaEmoji('🔍')">🔍</button>
        <button type="button" onclick="setTriviaEmoji('⭐')">⭐</button>
        <button type="button" onclick="setTriviaEmoji('🎉')">🎉</button>
      </div>
      <input type="text" id="triviaEmoji" placeholder="Or type / paste your own" oninput="renderPreview()" />
    </div>

    <!-- Content Blocks -->
    <div class="form-section">
      <div class="form-section-title">Content Sections</div>
      <div id="blocksContainer"></div>
      <div class="add-section-wrap">
        <div class="add-menu" id="addMenu">
          <button onclick="addBlock('image-text')"><strong>Image + Text</strong><span>Image on the left, text on the right</span></button>
          <button onclick="addBlock('two-column')"><strong>Two Column</strong><span>Two equal columns, each with heading &amp; body</span></button>
          <button onclick="addBlock('feature')"><strong>Feature</strong><span>Red highlight block for key announcements</span></button>
          <button onclick="addBlock('current-project')"><strong>Current Project</strong><span>Project overview with images, body and 'what this means for you'</span></button>
        </div>
        <button class="btn-add" onclick="toggleAddMenu(event)">+ Add Section</button>
      </div>
    </div>

    <!-- Quote -->
    <div class="form-section">
      <div class="form-section-title">Quote</div>
      <label for="quoteText">Quote</label>
      <textarea id="quoteText" rows="3" oninput="renderPreview()">"People ignore design that ignores people"</textarea>
      <label for="quoteAuthor" style="margin-top:10px;">Attribution</label>
      <input type="text" id="quoteAuthor" value="Frank Chimero" oninput="renderPreview()" />
    </div>

    <!-- Interesting Links -->
    <div class="form-section">
      <div class="form-section-title">The Procrastination Station</div>
      <label for="linksEyebrow">Section Label <span style="font-weight:400;color:#C8C8C8;">(optional)</span></label>
      <input type="text" id="linksEyebrow" placeholder="e.g. The Procrastination Station" value="The Procrastination Station" oninput="renderPreview()" />
      <label for="linksSubheading">Subheading <span style="font-weight:400;color:#C8C8C8;">(optional)</span></label>
      <input type="text" id="linksSubheading" placeholder="e.g. Here's our roundup of fun internet things to keep you…busy. Dive in!" value="Here's our roundup of fun internet things to keep you…busy. Dive in!" oninput="renderPreview()" />
      <div id="linksContainer"></div>
    </div>

    <!-- Footer -->
    <div class="form-section">
      <div class="form-section-title">Footer</div>
      <label for="footerMessage">Sign-off Message</label>
      <textarea id="footerMessage" rows="3" placeholder="e.g. Thanks for reading! Reach out to the comms team if you have something to share in next month's edition." oninput="renderPreview()"></textarea>
    </div>

    <!-- Trivia Answer -->
    <div class="form-section">
      <div class="form-section-title">Trivia Answer</div>
      <label for="triviaAnswer">Answer</label>
      <textarea id="triviaAnswer" rows="2" placeholder="e.g. 1995" oninput="renderPreview()"></textarea>
      <label for="triviaImageUrl">Image URL <span style="font-weight:400;color:#C8C8C8;">(optional)</span></label>
      <input type="text" id="triviaImageUrl" placeholder="e.g. https://res.cloudinary.com/…/image.jpg"
             oninput="processImageUrl(this, 'triviaImageUrlMsg', function() { renderPreview(); })"
             onpaste="setTimeout(function(){ processImageUrl(document.getElementById('triviaImageUrl'), 'triviaImageUrlMsg', function() { renderPreview(); }); }, 0)" />
      <div id="triviaImageUrlMsg"></div>
      <label for="triviaLinkLabel">Link Label <span style="font-weight:400;color:#C8C8C8;">(optional)</span></label>
      <input type="text" id="triviaLinkLabel" placeholder="e.g. Learn more" oninput="renderPreview()" />
      <label for="triviaLinkUrl">Link URL <span style="font-weight:400;color:#C8C8C8;">(optional)</span></label>
      <input type="text" id="triviaLinkUrl" placeholder="e.g. https://example.com/history" oninput="renderPreview()" />
    </div>

    <!-- Team -->
    <div class="form-section">
      <div class="form-section-title">Your Team This Edition</div>
      <label for="teamEyebrow">Section Label <span style="font-weight:400;color:#C8C8C8;">(optional)</span></label>
      <input type="text" id="teamEyebrow" placeholder="e.g. Made with love by all of us" value="Made with love by all of us" oninput="renderPreview()" />
      <div id="teamContainer"></div>
      <button class="btn-add" id="addTeamBtn" onclick="addTeamMember()" style="margin-top:8px;">+ Add Team Member</button>
    </div>

  </div>

  <!-- ════════════════════════════════════ -->
  <!-- PREVIEW PANEL                       -->
  <!-- ════════════════════════════════════ -->
  <div class="preview-panel">
    <div class="preview-label">Live Preview</div>
    <div class="preview-frame" id="previewFrame"></div>
  </div>

</div>

<!-- Bottom bar -->
<div class="bottom-bar">
  <span class="copy-feedback" id="copyFeedback">File downloaded!</span>
  <button class="btn-copy" onclick="exportHTML()">
    Export HTML
    <span class="btn-tooltip">Save a copy of this newsletter as an HTML file &mdash; useful for keeping a record of each edition or sharing with someone who needs the source file.</span>
  </button>
</div>

<script>
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  // ── State ──
  let blocks = [];
  let blockIdCounter = 0;

  function toggleAddMenu(e) {
    e.stopPropagation();
    document.getElementById('addMenu').classList.toggle('open');
  }
  document.addEventListener('click', () => document.getElementById('addMenu').classList.remove('open'));

  function addBlock(type) {
    type = type || 'standard';
    const base = { id: ++blockIdCounter, type, bylineName: '', bylineRole: '' };
    if (type === 'standard') {
      Object.assign(base, { heading: '', body: '', imageUrl: '', imageAlt: '', btnLabel: '', btnUrl: '' });
    } else if (type === 'image-text') {
      Object.assign(base, { imageUrl: '', imageAlt: '', heading: '', body: '', linkText: '', linkUrl: '' });
    } else if (type === 'two-column') {
      Object.assign(base, { leftHeading: '', leftBody: '', rightHeading: '', rightBody: '', btnLabel: '', btnUrl: '' });
    } else if (type === 'feature') {
      Object.assign(base, { eyebrow: '', featureImageUrl: '', heading: '', subheading: '', h2heading: '', body: '', btnLabel: '', btnUrl: '' });
    } else if (type === 'current-project') {
      Object.assign(base, { heading: '', imageLayout: '1x', image1Url: '', image1Alt: '', image2Url: '', image2Alt: '', image3Url: '', image3Alt: '', image4Url: '', image4Alt: '', body: '', whatThisMeans: '' });
    }
    blocks.push(base);
    document.getElementById('addMenu').classList.remove('open');
    renderBlocks();
    renderPreview();
  }

  function removeBlock(id) {
    blocks = blocks.filter(b => b.id !== id);
    renderBlocks();
    renderPreview();
  }

  function updateBlock(id, field, value) {
    const block = blocks.find(b => b.id === id);
    if (block) block[field] = value;
    updateCharCounters();
    renderPreview();
  }

  function bylineOptionsHTML() {
    const opts = teamMembers.map(m =>
      `<option value="${m.id}">${esc(m.name || '(unnamed)')}${m.title ? ' — ' + esc(m.title) : ''}</option>`
    ).join('');
    return `<option value="">— Pick from team —</option>${opts}`;
  }

  function setTriviaEmoji(emoji) {
    document.getElementById('triviaEmoji').value = emoji;
    renderPreview();
  }

  function pickBylineForBlock(blockId, memberId) {
    if (!memberId) return;

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function nl2br(s) {
    return esc(s).replace(/\n/g, '<br />');
  }

  // ── Image URL conversion ──
  function convertImageUrl(url) {
    url = url.trim();
    if (!url) return { url: '', warning: '', info: '' };

    // SharePoint detection
    if (/sharepoint\.com|\.sharepoint\./i.test(url)) {
      return { url: '', warning: '', info: 'SharePoint links aren\'t supported for images. Try uploading to Dropbox and pasting the share link instead.' };
    }

    // Google Drive: /file/d/ID/... → direct download URL
    const gdMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
    if (gdMatch) {
      return { url: 'https://drive.google.com/uc?export=view&id=' + gdMatch[1], warning: '', info: '' };
    }

    // Dropbox: ?dl=0 → ?raw=1
    if (/dropbox\.com/i.test(url)) {
      return { url: url.replace(/[?&]dl=0/, '?raw=1'), warning: '', info: '' };
    }

    return { url, warning: '', info: '' };
  }

  // ── Image load validation ──
  function validateImage(url, warningElId) {
    const el = document.getElementById(warningElId);
    if (!el) return;
    if (!url) { el.textContent = ''; el.className = ''; return; }
    const img = new Image();
    img.onload = () => { el.textContent = ''; el.className = ''; };
    img.onerror = () => {
      el.textContent = "Image couldn't be loaded — check the URL and make sure it's publicly accessible.";
      el.className = 'img-warning';
    };
    img.src = url;
  }

  // ── Process an image URL input field ──
  function processImageUrl(inputEl, warningElId, callback) {
    const raw = inputEl.value;
    const result = convertImageUrl(raw);
    const msgEl = document.getElementById(warningElId);
    if (result.info) {
      if (msgEl) { msgEl.textContent = result.info; msgEl.className = 'img-info'; }
      callback('');
      return;
    }
    if (result.url !== raw.trim() && result.url) {
      inputEl.value = result.url;
    }
    callback(result.url);
    if (result.url) {
      validateImage(result.url, warningElId);
    } else if (msgEl) {
      msgEl.textContent = ''; msgEl.className = '';
    }
  }

  // ── Generate team section HTML (embedded in footer) ──
  function generateTeamHTML() {

    function memberCell(m) {

      return `<table border="0" cellpadding="0" cellspacing="0" style="margin-top:10px; margin-bottom:12px;"><tr><td valign="middle">${nameHTML}${separator}${roleHTML}</td></tr></table>`;

    let contentBlocksHTML = '';

          <!-- TRIVIA QUESTION -->
          ${triviaQuestion ? `<tr>
            <td style="background-color: #E8383A; padding: 32px 40px;">

                    ${triviaEmoji ? `<p style="font-size: 24px; line-height: 1; margin: 0 0 18px 0; text-align: center;">${esc(triviaEmoji)}</p>` : ''}

                    <p style="font-family: 'Trebuchet MS', Trebuchet, Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; color: #ffffff; line-height: 1.3; margin: 0 0 18px 0; text-align: center;">${esc(triviaQuestion)}</p>
                    <p style="font-family: 'Trebuchet MS', Trebuchet, Arial, Helvetica, sans-serif; font-size: 14px; font-style: italic; color: #ffffff; margin: 0; text-align: center;">Scroll to the bottom to find out the answer.</p>
                  </td>

              </table>
            </td>

          <!-- CONTENT BLOCKS -->

          <!-- QUOTE -->
          ${quoteText ? `<tr>
            <td style="background-color: #E8383A; padding: 48px 40px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="center" style="text-align: center;">
                    <p style="font-family: Georgia, 'Times New Roman', Times, serif; font-size: 40px; font-weight: bold; font-style: italic; color: #ffffff; line-height: 1.2; margin: 0 0 18px 0; text-align: center;">${esc(quoteText)}</p>
                    <table border="0" cellpadding="0" cellspacing="0" align="center" style="margin: 0 auto;">
                      <tr>
                        <td style="padding-right: 8px;">
                          <span style="font-family: 'Trebuchet MS', Trebuchet, Arial, Helvetica, sans-serif; font-size: 17px; font-weight: bold; color: #ffffff;">💬</span>
                        </td>
                        ${quoteAuthor ? `<td>
                          <span style="font-family: 'Trebuchet MS', Trebuchet, Arial, Helvetica, sans-serif; font-size: 16px; color: #ffffff;">${esc(quoteAuthor)}</span>
                        </td>` : ''}
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>` : ''}

          <!-- INTERESTING LINKS -->
          ${generateLinksHTML()}

          <!-- FOOTER -->
          <tr>
            <td style="background-color: #000000; padding: 36px 40px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                ${footerContentHTML}
                ${triviaAnswer ? `<!-- TRIVIA ANSWER -->
                <tr>
                  <td style="padding: 0 0 24px 0;">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%">
                      <tr>
                        <td style="border-top: 1px solid #333333; padding-top: 20px;">
                          <p style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: bold; color: #E8383A; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 10px 0;">Trivia Answer</p>
                          ${triviaImageUrl ? `<img src="${esc(triviaImageUrl)}" alt="" width="120" style="display: block; width: 120px; max-width: 120px; height: auto; border: 0; outline: none; text-decoration: none; margin: 0 0 12px 0;" />` : ''}
                          <p style="font-family: Georgia, 'Times New Roman', Times, serif; font-size: 16px; color: #ffffff; line-height: 1.5; margin: 0 0 8px 0;">${esc(triviaAnswer)}</p>
                          ${(triviaLinkLabel && triviaLinkUrl) ? `<a href="${esc(triviaLinkUrl)}" target="_blank" style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #E8383A; text-decoration: underline;">${esc(triviaLinkLabel)}</a>` : ''}

                      This email was sent to you because you are an employee of Your Company Pty Ltd.<br />
                      123 Business Street, Sydney NSW 2000, Australia<br /><br />
                      &copy; 2026 Your Company. All rights reserved.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>`;
  }

  // ── Draft save / restore ──
  function getFormState() {
    const fieldIds = ['editionDate','editionNumber','logoUrl','heroImageUrl',
      'heroHeadline','heroBylineName','heroBylineRole','heroBody',
      'triviaQuestion','triviaEmoji','quoteText','quoteAuthor','linksEyebrow','linksSubheading',
      'footerMessage','triviaAnswer','triviaImageUrl','triviaLinkLabel','triviaLinkUrl',
      'teamEyebrow'];
    const fields = {};
    fieldIds.forEach(id => { const el = document.getElementById(id); if (el) fields[id] = el.value; });
    return {
      version: 1,
      savedAt: new Date().toISOString(),
      fields,
      blocks: JSON.parse(JSON.stringify(blocks)),
      interestingLinks: JSON.parse(JSON.stringify(interestingLinks)),
      teamMembers: JSON.parse(JSON.stringify(teamMembers)),
      blockIdCounter,
      teamIdCounter,
    };
  }

  function restoreFormState(state) {
    Object.entries(state.fields || {}).forEach(([id, value]) => {
      const el = document.getElementById(id);
      if (el) el.value = value;
    });
    blocks = state.blocks || [];
    blockIdCounter = state.blockIdCounter || 0;
    if (state.interestingLinks && state.interestingLinks.length === 3) interestingLinks = state.interestingLinks;
    teamMembers = state.teamMembers || [];
    teamIdCounter = state.teamIdCounter || 0;
    renderBlocks();
    renderLinks();
    renderTeam();
    renderHeroBylineOptions();
    updateCharCounters();
    renderPreview();
  }

  function saveToLocalStorage() {
    try { localStorage.setItem('gazette-draft', JSON.stringify(getFormState())); } catch(e) {}
  }

  function loadFromLocalStorage() {
    try {
      const raw = localStorage.getItem('gazette-draft');
      if (!raw) return;
      const state = JSON.parse(raw);
      restoreFormState(state);
      const dt = new Date(state.savedAt);
      document.getElementById('draftBannerText').textContent = 'Draft restored from ' + dt.toLocaleString();
      document.getElementById('draftBanner').style.display = 'flex';
    } catch(e) {}
  }

  function saveDraftFile() {
    const json = JSON.stringify(getFormState(), null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gazette-draft-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function loadDraftFile(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        restoreFormState(JSON.parse(e.target.result));
      } catch(err) {
        alert('Could not load draft: invalid or corrupted file.');
      }
    };
    reader.readAsText(file);
    input.value = '';
  }

  // ── Render preview ──
  function renderPreview() {
    document.getElementById('previewFrame').innerHTML = generateEmailHTML();
    saveToLocalStorage();
  }

  // ── Export HTML ──
  function exportHTML() {
    const html = generateEmailHTML();
    const now = new Date();
    const month = now.toLocaleString('en-US', { month: 'long' }).toLowerCase();
    const year = now.getFullYear();
    const filename = `newsletter-${month}-${year}.html`;

    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    const fb = document.getElementById('copyFeedback');
    fb.classList.add('show');
    setTimeout(() => fb.classList.remove('show'), 2000);
  }

  // ── Init ──
  const defaultPhoto = 'https://res.cloudinary.com/dxfep8qat/image/upload/v1773735345/samples/animals/cat.jpg';
  const defaultTeam = [
    { name: 'Arran Peck',      title: 'Senior CX Specialist' },
    { name: 'Abe Atiya',       title: 'Experience Director' },
    { name: 'Yolandi Lehner',  title: 'Senior CX Designer' },
    { name: 'Maryam Mahlberg', title: 'Senior CX Designer' },
    { name: 'Christian Moore', title: 'Senior Digital Designer' },
    { name: 'Sanjiv Menon',    title: 'Lead Experience Designer' },
    { name: 'Monique Pompe',   title: 'Senior CX Designer' }
  ];
  defaultTeam.forEach(t => {
    teamMembers.push({ id: ++teamIdCounter, imageUrl: defaultPhoto, name: t.name, title: t.title });
  });
  renderTeam();
  renderHeroBylineOptions();
  renderLinks();

  document.getElementById('heroHeadline').value = "Welcome to [Month's] CX Gazette";

  addBlock('current-project');
  renderPreview();

  loadFromLocalStorage();
  setInterval(saveToLocalStorage, 30000);
</script>
