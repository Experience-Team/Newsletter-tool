<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map Prototype — Data Centres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;800&family=Lato:wght@500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    /* ── Layout ── */
    .map-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    /* ── Google Map ── */
    #googleMap {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    /* ── Left panel ── */
    .left-panel {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 41.67%;
      background: rgba(255, 255, 255, 0.8);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      backdrop-filter: blur(2px);
    }
    .panel-top {
      display: flex;
      flex-direction: column;
      gap: 48px;
    }
    .panel-title {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-title h1 {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 60px;
      line-height: 60px;
      color: #000;
    }
    .panel-title p {
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      font-size: 16px;
      line-height: 1.5;
      color: #000;
    }
    /* ── Stat circles ── */
    .stat-circles {
      display: flex;
      gap: 12px;
    }
    .stat-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 1px solid #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      flex-shrink: 0;
    }
    .stat-circle-value {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 18px;
      line-height: 1.5;
      background: linear-gradient(to right, #353535, #a6a6a6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }
    .stat-circle-line {
      width: 80px;
      height: 1px;
      background: linear-gradient(to right, #353535, #a6a6a6);
    }
    .stat-circle-label {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 12px;
      line-height: 12px;
      text-align: center;
      color: #000;
      text-transform: uppercase;
    }
    .stat-circle-label.light {
      font-weight: 200;
      text-transform: none;
    }
    /* ── Bottom stats ── */
    .panel-bottom {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .stat-cards {
      display: flex;
      gap: 12px;
    }
    .stat-card {
      flex: 1;
      border-left: 1px solid #000;
      padding-left: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .stat-card-value {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 24px;
      background: linear-gradient(to right, #353535, #a6a6a6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-card-label {
      font-family: 'Lato', sans-serif;
      font-weight: 500;
      font-size: 16px;
      color: #000;
    }
    /* ── Nav arrow ── */
    .nav-arrow {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid #cdcdcd;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #000;
      transition: border-color 0.15s, background 0.15s;
    }
    .nav-arrow:hover {
      border-color: #000;
      background: rgba(0, 0, 0, 0.05);
    }
    /* ── Map pins (used as AdvancedMarkerElement content) ── */
    .map-pin {
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }
    .map-pin:hover {
      transform: scale(1.08);
    }
    .map-pin.clickable:hover {
      background: #333;
    }
    .map-pin span {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      white-space: nowrap;
      text-align: center;
      user-select: none;
    }
    .map-pin.large {
      width: 180px;
      height: 180px;
    }
    .map-pin.large span {
      font-size: 32px;
      line-height: 32px;
    }
    .map-pin.medium {
      width: 100px;
      height: 100px;
    }
    .map-pin.medium span {
      font-size: 24px;
      line-height: 24px;
    }
    .map-pin.small {
      width: 80px;
      height: 80px;
    }
    .map-pin.small span {
      font-size: 20px;
      line-height: 20px;
    }
    .map-pin.inactive {
      background: #6d6d6d;
      cursor: default;
    }
    .map-pin.inactive:hover {
      transform: none;
      background: #6d6d6d;
    }
    /* ── Back button ── */
    .back-btn {
      position: absolute;
      top: 20px;
      left: calc(41.67% + 80px);
      z-index: 15;
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 20px;
      text-transform: uppercase;
      border: none;
      border-radius: 360px;
      padding: 10px 20px;
      height: 40px;
      width: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, background 0.2s;
    }
    .back-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .back-btn:hover {
      background: #333;
    }
    /* ── Map controls ── */
    .map-controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .control-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid #cdcdcd;
      background: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      transition: border-color 0.15s, background 0.15s;
      backdrop-filter: blur(2px);
    }
    .control-btn:hover {
      border-color: #000;
      background: rgba(255, 255, 255, 0.95);
    }
    .zoom-row {
      display: flex;
      gap: 8px;
    }
    /* ── Breadcrumb ── */
    .breadcrumb {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 15;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .breadcrumb strong {
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>
<div class="map-container">
  <!-- Google Map -->
  <div id="googleMap"></div>
  <!-- Left panel -->
  <div class="left-panel">
    <div class="panel-top">
      <div class="panel-title">
        <h1>Data centres</h1>
        <p>Our global data centre network</p>
      </div>
      <div class="stat-circles">
        <div class="stat-circle">
          <span class="stat-circle-value">318MW</span>
          <div class="stat-circle-line"></div>
          <span class="stat-circle-label">Operational</span>
        </div>
        <div class="stat-circle">
          <span class="stat-circle-value">318MW</span>
          <div class="stat-circle-line"></div>
          <span class="stat-circle-label light">Under construction</span>
        </div>
        <div class="stat-circle">
          <span class="stat-circle-value">318MW</span>
          <div class="stat-circle-line"></div>
          <span class="stat-circle-label">In development</span>
        </div>
      </div>
    </div>
    <div class="panel-bottom">
      <div class="stat-cards">
        <div class="stat-card">
          <span class="stat-card-value">120+</span>
          <span class="stat-card-label">Customers in our robust ecosystem</span>
        </div>
        <div class="stat-card">
          <span class="stat-card-value">1,000+</span>
          <span class="stat-card-label">Network service providers</span>
        </div>
        <div class="stat-card">
          <span class="stat-card-value">43%</span>
          <span class="stat-card-label">Renewable energy in use</span>
        </div>
      </div>
      <button class="nav-arrow" onclick="goBack()" title="Go back">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M16 10H4M4 10L10 4M4 10L10 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <!-- Back button (on map) -->
  <button class="back-btn" id="backBtn" onclick="goBack()">Back</button>
  <!-- Breadcrumb -->
  <div class="breadcrumb" id="breadcrumb"><strong>Global</strong></div>
  <!-- Map controls -->
  <div class="map-controls">
    <button class="control-btn" id="expandBtn" title="Expand">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 7V3H7M13 3H17V7M17 13V17H13M7 17H3V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="zoom-row">
      <button class="control-btn" id="zoomOutBtn" title="Zoom out">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="control-btn" id="zoomInBtn" title="Zoom in">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- Replace YOUR_API_KEY with your Google Maps JavaScript API key -->
<script async src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=marker&v=weekly&callback=initMap"></script>

<script>
  // ── Pin data with real lat/lng coordinates ──
  const PIN_DATA = {
    global: {
      center: { lat: 25, lng: 55 },
      zoom: 3,
      pins: [
        { label: 'EMEA', lat: 48, lng: 20, size: 'large', target: 'emea' },
        { label: 'APAC', lat: 20, lng: 90, size: 'large', target: 'apac' }
      ]
    },
    apac: {
      bounds: { north: 45, south: -10, west: 68, east: 145 },
      pins: [
        { label: 'JPN', lat: 36.2, lng: 138.3, size: 'medium', target: 'jpn' },
        { label: 'KOR', lat: 35.9, lng: 127.8, size: 'medium', target: 'kor' },
        { label: 'IND', lat: 22.0, lng: 78.0, size: 'medium', target: 'ind' },
        { label: 'THA', lat: 15.9, lng: 100.5, size: 'medium', target: 'tha' },
        { label: 'VNM', lat: 16.0, lng: 108.0, size: 'medium', target: 'vnm' },
        { label: 'MYS', lat: 4.2, lng: 101.9, size: 'medium', target: 'mys' },
        { label: 'SGP', lat: 1.35, lng: 103.8, size: 'medium', target: 'sgp' },
        { label: 'IDN', lat: -2.5, lng: 118.0, size: 'medium', target: 'idn' },
        { label: 'PHL', lat: 12.9, lng: 121.8, size: 'medium', target: 'phl' }
      ]
    },
    emea: {
      bounds: { north: 58, south: 18, west: -10, east: 60 },
      pins: [
        { label: 'GBR', lat: 51.5, lng: -0.12, size: 'medium' },
        { label: 'NLD', lat: 52.4, lng: 4.9, size: 'medium' },
        { label: 'DEU', lat: 50.1, lng: 10.4, size: 'medium' },
        { label: 'FRA', lat: 46.6, lng: 2.3, size: 'medium' },
        { label: 'ARE', lat: 24.5, lng: 54.4, size: 'medium' },
        { label: 'SAU', lat: 24.7, lng: 46.7, size: 'medium' },
        { label: 'TUR', lat: 39.9, lng: 32.9, size: 'medium' }
      ]
    },
    ind: {
      bounds: { north: 33, south: 8, west: 68, east: 90 },
      pins: [
        { label: 'DEL', lat: 28.61, lng: 77.21, size: 'small' },
        { label: 'NID', lat: 28.58, lng: 77.33, size: 'small' },
        { label: 'JAI', lat: 26.91, lng: 75.79, size: 'small' },
        { label: 'AMD', lat: 23.02, lng: 72.57, size: 'small' },
        { label: 'BOM', lat: 19.08, lng: 72.88, size: 'small' },
        { label: 'PNQ', lat: 18.52, lng: 73.86, size: 'small' },
        { label: 'HYD', lat: 17.39, lng: 78.49, size: 'small' },
        { label: 'BLR', lat: 12.97, lng: 77.59, size: 'small' },
        { label: 'MAA', lat: 13.08, lng: 80.27, size: 'small', inactive: true },
        { label: 'CCU', lat: 22.57, lng: 88.36, size: 'small' }
      ]
    }
  };

  // ── Breadcrumb labels ──
  const breadcrumbs = {
    global: '<strong>Global</strong>',
    apac: 'Global &rsaquo; <strong>APAC</strong>',
    emea: 'Global &rsaquo; <strong>EMEA</strong>',
    ind: 'Global &rsaquo; APAC &rsaquo; <strong>India</strong>',
    jpn: 'Global &rsaquo; APAC &rsaquo; <strong>Japan</strong>',
    kor: 'Global &rsaquo; APAC &rsaquo; <strong>South Korea</strong>',
    tha: 'Global &rsaquo; APAC &rsaquo; <strong>Thailand</strong>',
    vnm: 'Global &rsaquo; APAC &rsaquo; <strong>Vietnam</strong>',
    mys: 'Global &rsaquo; APAC &rsaquo; <strong>Malaysia</strong>',
    sgp: 'Global &rsaquo; APAC &rsaquo; <strong>Singapore</strong>',
    idn: 'Global &rsaquo; APAC &rsaquo; <strong>Indonesia</strong>',
    phl: 'Global &rsaquo; APAC &rsaquo; <strong>Philippines</strong>'
  };

  // ── Dark map style ──
  const MAP_STYLE = [
    { elementType: 'geometry', stylers: [{ color: '#1a1a2e' }] },
    { elementType: 'labels.text.stroke', stylers: [{ color: '#1a1a2e' }] },
    { elementType: 'labels.text.fill', stylers: [{ color: '#4a4a5a' }] },
    { featureType: 'administrative', elementType: 'geometry.stroke', stylers: [{ color: '#2a2a3e' }] },
    { featureType: 'administrative.country', elementType: 'geometry.stroke', stylers: [{ color: '#2a2a3e' }, { weight: 1 }] },
    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0e0e1a' }] },
    { featureType: 'water', elementType: 'labels', stylers: [{ visibility: 'off' }] },
    { featureType: 'road', stylers: [{ visibility: 'off' }] },
    { featureType: 'poi', stylers: [{ visibility: 'off' }] },
    { featureType: 'transit', stylers: [{ visibility: 'off' }] },
    { featureType: 'landscape', elementType: 'geometry', stylers: [{ color: '#16213e' }] },
    { featureType: 'administrative.land_parcel', stylers: [{ visibility: 'off' }] },
    { featureType: 'administrative.neighborhood', stylers: [{ visibility: 'off' }] }
  ];

  // ── State ──
  let map;
  let currentView = 'global';
  const navHistory = [];
  let activeMarkers = [];

  // ── Initialize Google Map ──
  function initMap() {
    map = new google.maps.Map(document.getElementById('googleMap'), {
      center: PIN_DATA.global.center,
      zoom: PIN_DATA.global.zoom,
      styles: MAP_STYLE,
      mapId: 'DEMO_MAP_ID',
      disableDefaultUI: true,
      gestureHandling: 'greedy',
      minZoom: 2,
      maxZoom: 18,
      backgroundColor: '#0e0e1a'
    });

    // Wire zoom controls
    document.getElementById('zoomInBtn').addEventListener('click', () => {
      map.setZoom(map.getZoom() + 1);
    });
    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      map.setZoom(map.getZoom() - 1);
    });
    document.getElementById('expandBtn').addEventListener('click', () => {
      setView(currentView);
    });

    // Show initial view
    setView('global');
  }

  // ── Create a single marker ──
  function createMarker(pin) {
    const el = document.createElement('div');
    const sizeClass = pin.size || 'medium';
    el.className = 'map-pin ' + sizeClass + (pin.inactive ? ' inactive' : '') + (pin.target ? ' clickable' : '');
    el.innerHTML = '<span>' + pin.label + '</span>';

    if (pin.target && !pin.inactive) {
      el.addEventListener('click', () => navigate(pin.target));
    }

    const marker = new google.maps.marker.AdvancedMarkerElement({
      map: map,
      position: { lat: pin.lat, lng: pin.lng },
      content: el,
      zIndex: pin.size === 'large' ? 10 : (pin.size === 'medium' ? 5 : 1)
    });

    return marker;
  }

  // ── Clear all active markers ──
  function clearMarkers() {
    activeMarkers.forEach(m => { m.map = null; });
    activeMarkers = [];
  }

  // ── Set view ──
  function setView(view) {
    currentView = view;
    clearMarkers();

    const data = PIN_DATA[view];

    if (data) {
      // Create markers for this view
      data.pins.forEach(pin => {
        activeMarkers.push(createMarker(pin));
      });

      // Move the map
      if (data.center && data.zoom) {
        map.setCenter(data.center);
        map.setZoom(data.zoom);
      } else if (data.bounds) {
        const bounds = new google.maps.LatLngBounds(
          { lat: data.bounds.south, lng: data.bounds.west },
          { lat: data.bounds.north, lng: data.bounds.east }
        );
        const panelWidth = document.querySelector('.left-panel').offsetWidth;
        map.fitBounds(bounds, {
          left: panelWidth + 40,
          top: 40,
          right: 40,
          bottom: 40
        });
      }
    } else {
      // Views without pin data (e.g. jpn, kor) — just show breadcrumb
      // Could be extended later with city-level pins
    }

    // Update back button
    document.getElementById('backBtn').classList.toggle('visible', view !== 'global');

    // Update breadcrumb
    document.getElementById('breadcrumb').innerHTML =
      breadcrumbs[view] || '<strong>' + view.toUpperCase() + '</strong>';
  }

  // ── Navigation ──
  function navigate(target) {
    navHistory.push(currentView);
    setView(target);
  }

  function goBack() {
    if (!navHistory.length) return;
    const prev = navHistory.pop();
    setView(prev);
  }
</script>
</body>
</html>
