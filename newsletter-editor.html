<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter Editor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      color: #1a2b4a;
      line-height: 1.5;
    }

    /* ── Top bar ── */
    .topbar {
      background: #1a2b4a;
      color: #fff;
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar h1 { font-size: 16px; font-weight: 700; letter-spacing: .5px; }
    .topbar .hint { font-size: 12px; color: #8fafd4; }

    /* ── Layout ── */
    .editor-layout {
      display: flex;
      gap: 0;
      min-height: calc(100vh - 48px);
    }

    /* ── Form panel ── */
    .form-panel {
      width: 420px;
      min-width: 360px;
      background: #fff;
      border-right: 1px solid #dde2e8;
      padding: 28px 24px 80px;
      overflow-y: auto;
      max-height: calc(100vh - 48px);
    }

    .form-section {
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid #e8ecf0;
    }
    .form-section:last-child { border-bottom: none; }

    .form-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #e8a020;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1a2b4a;
      margin-bottom: 5px;
    }

    input[type="text"], textarea {
      display: block;
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #d1dae6;
      border-radius: 4px;
      background: #f9fafb;
      color: #1a2b4a;
      transition: border-color .15s;
      margin-bottom: 14px;
    }
    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: #2e6dbf;
      background: #fff;
    }
    textarea { resize: vertical; min-height: 80px; }

    .inline-fields {
      display: flex;
      gap: 10px;
    }
    .inline-fields .field { flex: 1; }
    .inline-fields .field-narrow { flex: 0 0 35%; }

    /* ── Content blocks ── */
    .content-block {
      background: #f6f8fc;
      border: 1px solid #e8ecf0;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
      position: relative;
    }
    .content-block .block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .content-block .block-number {
      font-size: 12px;
      font-weight: 700;
      color: #1a2b4a;
    }

    .btn-remove {
      background: none;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      color: #a0aec0;
      font-size: 12px;
      padding: 3px 10px;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-remove:hover { color: #e53e3e; border-color: #e53e3e; }

    .btn-add {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px dashed #2e6dbf;
      border-radius: 6px;
      color: #2e6dbf;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      transition: all .15s;
      width: 100%;
      justify-content: center;
    }
    .btn-add:hover { background: #eef4fb; }

    /* ── Preview panel ── */
    .preview-panel {
      flex: 1;
      overflow-y: auto;
      max-height: calc(100vh - 48px);
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #a0aec0;
      margin-bottom: 16px;
    }

    .preview-frame {
      width: 640px;
      background: #f0f2f5;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid #dde2e8;
      padding: 12px 32px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      z-index: 100;
    }

    .btn-copy {
      background: #1a2b4a;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 11px 28px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-copy:hover { background: #2e4a7a; }

    .copy-feedback {
      font-size: 13px;
      color: #2e9e6b;
      font-weight: 600;
      opacity: 0;
      transition: opacity .2s;
    }
    .copy-feedback.show { opacity: 1; }
  </style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <h1>Newsletter Editor</h1>
  <span class="hint">Fill in the form on the left &mdash; the preview updates live</span>
</div>

<div class="editor-layout">

  <!-- ════════════════════════════════════ -->
  <!-- FORM PANEL                          -->
  <!-- ════════════════════════════════════ -->
  <div class="form-panel">

    <!-- Header -->
    <div class="form-section">
      <div class="form-section-title">Header</div>
      <label for="title">Newsletter Title</label>
      <input type="text" id="title" placeholder="e.g. Company Monthly Update" oninput="renderPreview()" />
      <label for="edition">Edition / Date</label>
      <input type="text" id="edition" placeholder="e.g. March 2026 &middot; Issue #12" oninput="renderPreview()" />
      <label for="logoUrl">Logo Image URL <span style="font-weight:400;color:#a0aec0;">(optional)</span></label>
      <input type="text" id="logoUrl" placeholder="e.g. https://yoursite.com/logo.png" oninput="renderPreview()" />
    </div>

    <!-- Main Story -->
    <div class="form-section">
      <div class="form-section-title">Main Story</div>
      <label for="heroHeadline">Headline</label>
      <input type="text" id="heroHeadline" placeholder="e.g. Welcome to Our March Company Update" oninput="renderPreview()" />
      <label for="heroBody">Body</label>
      <textarea id="heroBody" rows="4" placeholder="e.g. A lot has happened across the business this month &mdash; from product milestones to team growth and a few wins worth celebrating." oninput="renderPreview()"></textarea>
    </div>

    <!-- Content Blocks -->
    <div class="form-section">
      <div class="form-section-title">Content Sections</div>
      <div id="blocksContainer"></div>
      <button class="btn-add" onclick="addBlock()">+ Add Section</button>
    </div>

    <!-- Footer -->
    <div class="form-section">
      <div class="form-section-title">Footer</div>
      <label for="footerMessage">Sign-off Message</label>
      <textarea id="footerMessage" rows="3" placeholder="e.g. Thanks for reading! Reach out to the comms team if you have something to share in next month's edition." oninput="renderPreview()"></textarea>
    </div>

  </div>

  <!-- ════════════════════════════════════ -->
  <!-- PREVIEW PANEL                       -->
  <!-- ════════════════════════════════════ -->
  <div class="preview-panel">
    <div class="preview-label">Live Preview</div>
    <div class="preview-frame" id="previewFrame"></div>
  </div>

</div>

<!-- Bottom bar -->
<div class="bottom-bar">
  <span class="copy-feedback" id="copyFeedback">Copied to clipboard!</span>
  <button class="btn-copy" onclick="copyHTML()">Copy HTML</button>
</div>

<script>
  // ── State ──
  let blocks = [];
  let blockIdCounter = 0;

  function addBlock() {
    blocks.push({ id: ++blockIdCounter, heading: '', body: '', imageUrl: '', imageAlt: '' });
    renderBlocks();
    renderPreview();
  }

  function removeBlock(id) {
    blocks = blocks.filter(b => b.id !== id);
    renderBlocks();
    renderPreview();
  }

  function updateBlock(id, field, value) {
    const block = blocks.find(b => b.id === id);
    if (block) block[field] = value;
    renderPreview();
  }

  function renderBlocks() {
    const container = document.getElementById('blocksContainer');
    container.innerHTML = blocks.map((b, i) => `
      <div class="content-block">
        <div class="block-header">
          <span class="block-number">Section ${i + 1}</span>
          <button class="btn-remove" onclick="removeBlock(${b.id})">Remove</button>
        </div>
        <label>Heading</label>
        <input type="text" value="${escAttr(b.heading)}" placeholder="e.g. Project Spotlight"
               oninput="updateBlock(${b.id}, 'heading', this.value)" />
        <label>Body</label>
        <textarea rows="3" placeholder="Write the content for this section..."
                  oninput="updateBlock(${b.id}, 'body', this.value)">${esc(b.body)}</textarea>
        <div class="inline-fields">
          <div class="field">
            <label>Image URL <span style="font-weight:400;color:#a0aec0;">(optional)</span></label>
            <input type="text" value="${escAttr(b.imageUrl)}" placeholder="e.g. https://yoursite.com/photo.jpg"
                   oninput="updateBlock(${b.id}, 'imageUrl', this.value)" />
          </div>
          <div class="field-narrow">
            <label>Alt Text</label>
            <input type="text" value="${escAttr(b.imageAlt)}" placeholder="Describe the image"
                   oninput="updateBlock(${b.id}, 'imageAlt', this.value)" />
          </div>
        </div>
      </div>
    `).join('');
  }

  // ── Helpers ──
  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escAttr(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function nl2br(s) {
    return esc(s).replace(/\n/g, '<br />');
  }

  function val(id) { return document.getElementById(id).value; }

  // ── Generate email HTML ──
  function generateEmailHTML() {
    const title     = val('title') || 'Company Newsletter';
    const edition   = val('edition') || '';
    const headline  = val('heroHeadline') || 'Newsletter Headline';
    const heroBody  = val('heroBody') || '';
    const footer    = val('footerMessage') || '';
    const logoUrl   = val('logoUrl') || '';

    let contentBlocksHTML = '';
    blocks.forEach((b, i) => {
      if (!b.heading && !b.body && !b.imageUrl) return;
      const isLast = i === blocks.length - 1;
      const imgHTML = b.imageUrl ? `
                          <!--[if mso]><table border="0" cellpadding="0" cellspacing="0" width="520"><tr><td><![endif]-->
                          <img src="${esc(b.imageUrl)}" alt="${esc(b.imageAlt || '')}" width="520" style="display: block; max-width: 100%; width: 520px; height: auto; border: 0; outline: none; text-decoration: none; border-radius: 4px; margin: 0 0 16px 0;" />
                          <!--[if mso]></td></tr></table><![endif]-->` : '';
      contentBlocksHTML += `
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="padding: ${i === 0 ? '32' : '28'}px 0 0 0;">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%">
                      <tr>
                        <td valign="top">
                          <h2 style="font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: bold; color: #1a2b4a; line-height: 1.3; margin: 0 0 10px 0;">${esc(b.heading)}</h2>${imgHTML}
                          <p style="font-family: Arial, Helvetica, sans-serif; font-size: 15px; color: #4a5568; line-height: 1.7; margin: 0;">${nl2br(b.body)}</p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                ${!isLast ? `<tr><td style="padding: 28px 0 0 0; border-bottom: 1px solid #e8ecf0; font-size: 0; line-height: 0;">&nbsp;</td></tr>` : `<tr><td style="padding-bottom: 40px;">&nbsp;</td></tr>`}
              </table>`;
    });

    // Wrap content blocks in the section with the "This Month's Highlights" label if there are blocks
    let contentSectionHTML = '';
    if (contentBlocksHTML) {
      contentSectionHTML = `
          <tr>
            <td style="padding: 0 40px 0 40px; background-color: #ffffff;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="padding: 40px 0 24px 0; border-bottom: 2px solid #e8a020;">
                    <span style="font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; color: #1a2b4a; text-transform: uppercase; letter-spacing: 2px;">This Month's Highlights</span>
                  </td>
                </tr>
              </table>
              ${contentBlocksHTML}
            </td>
          </tr>`;
    }

    let footerContentHTML = '';
    if (footer) {
      footerContentHTML = `
                <tr>
                  <td align="center" style="padding-bottom: 24px;">
                    <p style="font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: #b0c6e0; line-height: 1.7; margin: 0;">${nl2br(footer)}</p>
                  </td>
                </tr>`;
    }

    return `<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>${esc(title)}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #f0f2f5; font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">

  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f0f2f5;">
    <tr>
      <td align="center" style="padding: 32px 16px;">

        <table border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 4px; overflow: hidden;">

          <!-- HEADER -->
          <tr>
            <td style="background-color: #1a2b4a; padding: 0;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td align="left" valign="middle" style="padding: 28px 40px;">
                    ${logoUrl ? `<!--[if mso]><table border="0" cellpadding="0" cellspacing="0"><tr><td><![endif]--><img src="${esc(logoUrl)}" alt="${esc(title)}" width="180" style="display: block; max-width: 180px; width: 180px; height: auto; border: 0; outline: none; text-decoration: none;" />${'<!--[if mso]></td></tr></table><![endif]-->'}` : `<table border="0" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="background-color: #2e4a7a; border-radius: 3px; padding: 10px 18px;">
                          <span style="font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: bold; color: #ffffff; letter-spacing: 1px; text-decoration: none;">&#9632;&nbsp; YOUR LOGO</span>
                        </td>
                      </tr>
                    </table>`}
                  </td>
                  <td align="right" valign="middle" style="padding: 28px 40px;">
                    <span style="font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; color: #8fafd4; text-transform: uppercase; letter-spacing: 1.5px;">${esc(edition)}</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Accent bar -->
          <tr>
            <td style="background-color: #e8a020; height: 4px; font-size: 0; line-height: 0;">&nbsp;</td>
          </tr>

          <!-- HERO -->
          <tr>
            <td style="background-color: #1a2b4a; padding: 48px 40px 52px 40px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td>
                    <p style="font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; color: #e8a020; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 14px 0;">Internal Newsletter</p>
                    <h1 style="font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: bold; color: #ffffff; line-height: 1.25; margin: 0 0 20px 0;">${esc(headline)}</h1>
                    <p style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: #b0c6e0; line-height: 1.7; margin: 0;">${nl2br(heroBody)}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- CONTENT BLOCKS -->
          ${contentSectionHTML}

          <!-- FOOTER -->
          <tr>
            <td style="background-color: #1a2b4a; padding: 36px 40px;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                ${footerContentHTML}
                <tr>
                  <td align="center" style="padding-bottom: 20px;">
                    <span style="font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; color: #ffffff; letter-spacing: 1px;">&#9632;&nbsp; YOUR COMPANY</span>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding-bottom: 20px;">
                    <a href="#" style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #8fafd4; text-decoration: none; padding: 0 10px;">Intranet</a>
                    <span style="color: #2e4a7a; font-size: 12px;">|</span>
                    <a href="#" style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #8fafd4; text-decoration: none; padding: 0 10px;">Slack</a>
                    <span style="color: #2e4a7a; font-size: 12px;">|</span>
                    <a href="#" style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #8fafd4; text-decoration: none; padding: 0 10px;">HR Portal</a>
                  </td>
                </tr>
                <tr>
                  <td style="border-top: 1px solid #2e4a7a; padding-bottom: 20px; font-size: 0; line-height: 0;">&nbsp;</td>
                </tr>
                <tr>
                  <td align="center">
                    <p style="font-family: Arial, Helvetica, sans-serif; font-size: 11px; color: #5a7a9e; line-height: 1.6; margin: 0;">
                      This email was sent to you because you are an employee of Your Company Pty Ltd.<br />
                      123 Business Street, Sydney NSW 2000, Australia<br /><br />
                      &copy; 2026 Your Company. All rights reserved.
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>`;
  }

  // ── Render preview ──
  function renderPreview() {
    document.getElementById('previewFrame').innerHTML = generateEmailHTML();
  }

  // ── Copy HTML ──
  function copyHTML() {
    const html = generateEmailHTML();
    navigator.clipboard.writeText(html).then(() => {
      const fb = document.getElementById('copyFeedback');
      fb.classList.add('show');
      setTimeout(() => fb.classList.remove('show'), 2000);
    });
  }

  // ── Init: add one default block and render ──
  addBlock();
  renderPreview();
</script>

</body>
</html>
